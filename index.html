<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oscars @ The Pollocks</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Montserrat:wght@300;400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#c9a84c;--gold2:#e8c96a;--bg:#0a0a0b;--bg2:#111113;--bg3:#18181b;--border:#222226;--text:#f0ede6;--muted:#777;--dim:#333;}
body{background:var(--bg);color:var(--text);font-family:'Montserrat',sans-serif;min-height:100vh;}

.hdr{text-align:center;padding:32px 20px 0;}
.hdr-rule{width:48px;height:1px;background:var(--gold);margin:0 auto 14px;}
.hdr h1{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;}
.hdr h1 em{display:block;font-style:italic;font-weight:400;font-size:16px;color:var(--gold);margin-top:3px;}
.hdr-meta{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);margin-top:8px;padding-bottom:20px;}

.top-tabs{display:flex;justify-content:center;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:200;padding:0 20px;}
.top-tab{font-size:9px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;padding:13px 18px;cursor:pointer;border:none;background:none;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;}
.top-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.top-tab:hover{color:var(--text);}

.sec-tabs{display:flex;justify-content:center;gap:4px;padding:16px 20px 0;}
.sec-tab{font-size:8px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;padding:7px 16px;cursor:pointer;border:1px solid var(--border);background:none;color:var(--muted);border-radius:20px;transition:all .2s;}
.sec-tab.active{background:var(--gold);color:#1a1200;border-color:var(--gold);}
.sec-tab:hover:not(.active){color:var(--text);border-color:var(--dim);}

.panel{display:none;padding:0 16px 60px;max-width:960px;margin:0 auto;}
.panel.active{display:block;}
.sec-panel{display:none;}
.sec-panel.active{display:block;}

.name-box{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:22px;margin:16px 0;text-align:center;}
.name-box p{font-size:11px;color:var(--muted);margin-bottom:12px;font-style:italic;}
.name-row{display:flex;gap:8px;justify-content:center;}
.name-row input{font-family:'Playfair Display',serif;font-size:15px;padding:8px 14px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text);width:200px;}
.name-row input:focus{outline:none;border-color:var(--gold);}
.greeted{font-size:8px;color:var(--muted);letter-spacing:.15em;text-transform:uppercase;text-align:center;margin:10px 0 0;}

.btn{font-family:'Montserrat',sans-serif;font-size:9px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;padding:9px 20px;border:none;border-radius:3px;cursor:pointer;transition:all .2s;}
.btn-primary{background:var(--text);color:var(--bg);}
.btn-primary:hover{background:#fff;}
.btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1200;}
.btn-gold:hover{opacity:.9;}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{color:var(--text);}

.cat-block{margin-bottom:28px;}
.cat-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);}
.cat-title{font-size:9px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);}
.cat-picked{font-size:10px;color:var(--gold);font-style:italic;font-family:'Playfair Display',serif;}

.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:10px;}
.img-tile{border-radius:6px;overflow:hidden;cursor:pointer;border:2px solid transparent;transition:border-color .2s,transform .15s;background:var(--bg3);display:flex;flex-direction:column;position:relative;}
.img-tile:hover{transform:translateY(-3px);}
.img-tile.selected{border-color:var(--gold);}
.img-wrap{position:relative;padding-top:130%;overflow:hidden;background:var(--bg3);}
.img-wrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:opacity .4s;opacity:0;}
.img-wrap img.loaded{opacity:1;}
.img-placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;transition:opacity .3s;}
.img-placeholder.hidden{opacity:0;pointer-events:none;}
.img-placeholder-icon{font-size:28px;opacity:.3;}
.img-placeholder-text{font-size:9px;color:var(--muted);text-align:center;line-height:1.4;}
.img-check{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;background:var(--gold);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:12px;color:#1a1200;font-weight:700;z-index:2;}
.img-tile.selected .img-check{opacity:1;}
.img-info{padding:8px 9px 7px;background:var(--bg2);}
.img-title{font-family:'Playfair Display',serif;font-size:12px;line-height:1.3;color:var(--text);}
.img-tile.selected .img-title{color:var(--gold);}
.img-sub{font-size:9px;color:var(--muted);line-height:1.3;margin-top:2px;}
.img-lb{display:inline-block;font-size:8px;letter-spacing:.06em;color:var(--dim);border-bottom:1px solid var(--dim);margin-top:5px;transition:color .15s;}
.img-tile:hover .img-lb{color:var(--muted);}

.text-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;}
.text-tile{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:10px 12px;cursor:pointer;position:relative;transition:background .15s,border-color .2s;display:flex;flex-direction:column;gap:3px;}
.text-tile:hover{background:var(--bg3);}
.text-tile.selected{border-color:var(--gold);background:#1a1500;}
.text-tile.selected::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);border-radius:3px 0 0 3px;}
.text-main{font-family:'Playfair Display',serif;font-size:12px;line-height:1.3;}
.text-tile.selected .text-main{color:var(--gold);}
.text-sub{font-size:9px;color:var(--muted);}
.text-lb{font-size:8px;letter-spacing:.06em;color:var(--dim);border-bottom:1px solid var(--dim);width:fit-content;margin-top:4px;}
.text-tile:hover .text-lb{color:var(--muted);}
.text-check{position:absolute;top:8px;right:8px;font-size:10px;color:var(--gold);opacity:0;}
.text-tile.selected .text-check{opacity:1;}

.submit-row{text-align:center;margin-top:28px;padding-top:20px;border-top:1px solid var(--border);}
.submit-row p{font-size:11px;color:var(--muted);font-style:italic;margin-top:8px;}
.progress-wrap{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:16px;}
.progress-bar{width:180px;height:2px;background:var(--border);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s;}
.progress-label{font-size:9px;color:var(--muted);letter-spacing:.1em;}

.lb-header{text-align:center;padding:24px 0 20px;}
.lb-title{font-family:'Playfair Display',serif;font-size:24px;margin-bottom:6px;}
.lb-status{font-size:8px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
.lb-podium{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px;margin-bottom:18px;align-items:end;}
.podium-card{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px 10px;text-align:center;position:relative;overflow:hidden;}
.podium-card.first{border-color:var(--gold);background:#130f00;}
.podium-card.first::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--gold2));}
.podium-rank{font-family:'Playfair Display',serif;font-size:30px;font-weight:700;color:var(--dim);}
.podium-card.first .podium-rank{color:var(--gold);}
.podium-name{font-family:'Playfair Display',serif;font-size:14px;margin:6px 0 4px;}
.podium-score{font-size:10px;font-weight:600;color:var(--muted);}
.podium-card.first .podium-score{color:var(--gold);}
.lb-list{display:flex;flex-direction:column;gap:4px;}
.lb-row{background:var(--bg2);border:1px solid var(--border);border-radius:5px;display:flex;align-items:center;gap:14px;padding:13px 16px;position:relative;overflow:hidden;}
.lb-bg{position:absolute;left:0;top:0;bottom:0;background:rgba(201,168,76,.06);transition:width .6s;}
.lb-rank{font-family:'Playfair Display',serif;font-size:18px;font-weight:700;color:var(--dim);width:24px;text-align:center;flex-shrink:0;position:relative;}
.lb-name{font-family:'Playfair Display',serif;font-size:15px;flex:1;position:relative;}
.lb-meta{font-size:9px;color:var(--muted);position:relative;}
.lb-pts{font-size:12px;font-weight:600;color:var(--gold);position:relative;}
.lb-empty{text-align:center;padding:50px;color:var(--muted);font-style:italic;font-size:13px;}
.lb-note{font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);text-align:center;margin-top:14px;}

.admin-gate{text-align:center;padding:40px 20px;}
.admin-gate p{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:14px;}
.admin-input{font-family:'Montserrat',sans-serif;font-size:12px;padding:7px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);}
.admin-input:focus{outline:none;border-color:var(--gold);}
.admin-cat{background:var(--bg2);border:1px solid var(--border);border-radius:5px;padding:10px 14px;margin-bottom:6px;}
.admin-cat select{font-family:'Montserrat',sans-serif;font-size:11px;padding:5px 8px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);width:100%;margin-top:5px;}
.admin-cat select:focus{outline:none;border-color:var(--gold);}
.winner-set{font-size:9px;color:var(--gold);letter-spacing:.08em;margin-top:4px;}
.score-btn-row{text-align:center;margin-top:18px;display:flex;gap:8px;justify-content:center;}

.config-panel{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:18px;margin-bottom:12px;}
.config-panel p{font-size:12px;color:var(--muted);font-style:italic;margin-bottom:10px;line-height:1.6;}
.config-panel textarea{width:100%;font-family:'Montserrat',sans-serif;font-size:10px;padding:8px;background:var(--bg3);border:1px solid var(--border);border-radius:3px;color:var(--text);height:130px;resize:vertical;}
.config-panel textarea:focus{outline:none;border-color:var(--gold);}
.config-status{font-size:9px;letter-spacing:.1em;text-transform:uppercase;margin-top:6px;}
.config-status.ok{color:#4a9e6e;}.config-status.err{color:#c04040;}

.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);font-size:11px;font-weight:700;letter-spacing:.1em;padding:10px 24px;border-radius:4px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-rule"></div>
  <h1>98th Academy Awards <em>@ The Pollocks</em></h1>
  <div class="hdr-meta">March 15, 2026 &nbsp;·&nbsp; Submit your picks before the show</div>
</div>

<div class="top-tabs">
  <button class="top-tab active" onclick="switchTop('ballot',event)">My Ballot</button>
  <button class="top-tab" onclick="switchTop('leaderboard',event)">Leaderboard</button>
  <button class="top-tab" onclick="switchTop('admin',event)">Admin</button>
  <button class="top-tab" onclick="switchTop('config',event)">⚙</button>
</div>

<div id="tab-ballot" class="panel active">
  <div class="name-box" id="name-box">
    <p>Enter your name to save your picks</p>
    <div class="name-row">
      <input type="text" id="name-input" placeholder="Your name" maxlength="30" onkeydown="if(event.key==='Enter')setName()">
      <button class="btn btn-primary" onclick="setName()">Go</button>
    </div>
  </div>
  <div id="greeted" class="greeted" style="display:none"></div>
  <div class="sec-tabs">
    <button class="sec-tab active" onclick="switchSec('major',event)">Major Awards</button>
    <button class="sec-tab" onclick="switchSec('craft',event)">Craft &amp; Technical</button>
    <button class="sec-tab" onclick="switchSec('special',event)">Special</button>
  </div>
  <div style="padding-top:20px;">
    <div id="sec-major" class="sec-panel active"></div>
    <div id="sec-craft" class="sec-panel"></div>
    <div id="sec-special" class="sec-panel"></div>
  </div>
  <div class="submit-row">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
      <div class="progress-label" id="progress-label">0 / 18 picked</div>
    </div>
    <button class="btn btn-gold" onclick="submitPicks()">Submit My Picks</button>
